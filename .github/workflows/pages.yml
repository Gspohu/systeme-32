# Builds the static site and publishes it on GitHub Pages under /<repository>
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # the npm 10 bundled with node 22 crashes on the vitest 5 peer set ("reading 'edgesOut'")
      - run: npm install --global npm@12.0.2 --no-fund --no-audit
      # no lockfile in the repository : every dependency is pinned to an exact version in package.json
      - run: npm install --no-fund --no-audit
        env:
          # the end to end suite drives the Google Chrome of the runner image
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm test
      # builds and serves its own copy at the root path, nothing is published when it fails
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
